name: Auto-Train V4 Cloud
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scipy scikit-learn requests streamlit
      - run: mkdir -p .streamlit && touch .streamlit/secrets.toml
      - run: python train_cloud.py
      
