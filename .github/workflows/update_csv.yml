name: Telechargement Archives Backtest
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Telechargement CSV Bet365
        run: |
          mkdir -p historique/2425 historique/2526
          for s in 2425 2526; do
            for c in F1 E0 E1 SP1 I1 D1 P1 N1; do
              curl -sL -A "Mozilla/5.0" "https://football-data.co.uk{s}/${c}.csv" -o "historique/${s}/${c}.csv" || true
            done
          done
      - name: Sauvegarde dans le depot
        run: |
          git config user.name "SmartStake Bot"
          git config user.email "bot@smartstake.app"
          git add historique/
          git commit -m "Update archives backtest" || exit 0
          git push
          
